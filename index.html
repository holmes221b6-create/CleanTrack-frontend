<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CleanTrack - Facility Hygiene Management System"
    >

    <title>CleanTrack</title>


    <!-- =================================================
         GLOBAL CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >
    
    <link
    rel="stylesheet"
    href="css/home.css"
    
    >

</head>


<body>


<!-- =====================================================
     APPLICATION ROOT
====================================================== -->

<div id="app">


    <!-- =================================================
         AUTHENTICATION AREA

         Login / registration will be rendered here.
    ================================================== -->

    <div
        id="auth-container"
        class="hidden"
    ></div>


    <!-- =================================================
         MAIN APPLICATION
    ================================================== -->

    <div
        id="application"
        class="hidden"
    >


        <!-- =============================================
             SIDEBAR
        ============================================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <!-- Logo -->

            <div class="sidebar-brand">

                <div class="brand-logo">
                    CT
                </div>

                <div class="brand-text">

                    <div class="brand-name">
                        Clean<span>Track</span>
                    </div>

                    <div class="brand-subtitle">
                        Facility Management
                    </div>

                </div>

            </div>


            <!-- User -->

            <div
                id="sidebar-user"
                class="sidebar-user"
            >

                <div
                    id="sidebar-avatar"
                    class="avatar"
                >
                    ?
                </div>

                <div class="sidebar-user-info">

                    <div
                        id="sidebar-user-name"
                        class="sidebar-user-name"
                    >
                        User
                    </div>

                    <div
                        id="sidebar-user-role"
                        class="sidebar-user-role"
                    >
                        Role
                    </div>

                </div>

            </div>


            <!-- Navigation -->

            <nav
                id="main-navigation"
                class="main-navigation"
            >

                <!--
                    Navigation is generated
                    dynamically according to role.
                -->

            </nav>


            <!-- Sidebar footer -->

            <div class="sidebar-footer">

                <button
                    id="logout-button"
                    class="sidebar-logout"
                    type="button"
                >

                    <span class="logout-icon">
                        ↪
                    </span>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </aside>


        <!-- =============================================
             MAIN CONTENT
        ============================================== -->

        <div class="app-content">


            <!-- =========================================
                 TOPBAR
            ========================================== -->
            
            <header class="topbar">

    <!-- Mobile menu -->
    <button
        id="mobile-menu-button"
        class="icon-button mobile-menu-button"
        type="button"
        aria-label="Open menu"
    >
        &#9776;
    </button>


    <!-- Current page -->
    <div class="topbar-page">

        <div
            id="topbar-title"
            class="topbar-title"
        >
            Home
        </div>

        <div
            id="topbar-subtitle"
            class="topbar-subtitle"
        >
            CleanTrack
        </div>

    </div>


    <!-- Global search -->
    <div class="global-search">

        <span class="global-search-icon">
            &#128269;
        </span>

        <input
            id="global-search-input"
            type="search"
            placeholder="Search CleanTrack..."
            autocomplete="off"
            aria-label="Search CleanTrack"
        />

        <span class="global-search-key">
            /
        </span>

    </div>


    <!-- Right side -->
    <div class="topbar-actions">

        <!-- Notifications -->
        <button
            id="notification-button"
            class="icon-button notification-button"
            type="button"
            aria-label="Notifications"
            title="Notifications"
        >
            &#128276;

            <span
                id="notification-count"
                class="notification-count hidden"
            >
                0
            </span>
        </button>


        <!-- AI Help -->
        <button
            id="ai-help-button"
            class="icon-button ai-help-button"
            type="button"
            aria-label="AI Help"
            title="AI Help"
        >
            &#10024;
        </button>


        <!-- Profile -->
        <button
            id="profile-button"
            class="profile-button"
            type="button"
            aria-expanded="false"
            aria-label="Open profile menu"
        >

            <span
                id="topbar-avatar"
                class="avatar avatar-sm"
            >
                ?
            </span>

            <span
                id="topbar-user-name"
                class="profile-name"
            >
                User
            </span>

            <span class="profile-chevron">
                &#9662;
            </span>

        </button>


        <!-- Profile dropdown -->
        <div
            id="global-profile-menu"
            class="global-profile-menu hidden"
        >

            <div class="global-profile-header">

                <strong id="global-profile-name">
                    User
                </strong>

                <span id="global-profile-role">
                    Administrator
                </span>

            </div>

            <div class="global-profile-divider"></div>

            <button
                type="button"
                data-global-profile="profile"
            >
                My Profile
            </button>

            <button
                type="button"
                data-global-profile="settings"
            >
                Settings
            </button>

            <div class="global-profile-divider"></div>

            <button
                type="button"
                class="global-profile-logout"
                data-global-profile="logout"
            >
                Logout
            </button>

        </div>

    </div>

</header>


            <!-- =========================================
                 PAGE CONTENT
            ========================================== -->

            <main
                id="page-content"
                class="page-content"
            >

                <!-- Dynamic page content -->

                <div
                    id="page-view"
                    class="page-view"
                ></div>

            </main>


        </div>

    </div>


</div>


<!-- =====================================================
     GLOBAL TOAST CONTAINER
====================================================== -->

<div
    id="toast-container"
    class="toast-container"
></div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/navigation.js"></script>

<script src="js/app.js"></script>


</body>

</html>
