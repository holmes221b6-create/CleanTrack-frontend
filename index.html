<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CleanTrack - Facility Hygiene Management System"
    >

    <title>CleanTrack</title>


    <!-- =================================================
         GLOBAL CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>


<!-- =====================================================
     APPLICATION ROOT
====================================================== -->

<div id="app">


    <!-- =================================================
         AUTHENTICATION AREA

         Login / registration will be rendered here.
    ================================================== -->

    <div
        id="auth-container"
        class="hidden"
    ></div>


    <!-- =================================================
         MAIN APPLICATION
    ================================================== -->

    <div
        id="application"
        class="hidden"
    >


        <!-- =============================================
             SIDEBAR
        ============================================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <!-- Logo -->

            <div class="sidebar-brand">

                <div class="brand-logo">
                    CT
                </div>

                <div class="brand-text">

                    <div class="brand-name">
                        Clean<span>Track</span>
                    </div>

                    <div class="brand-subtitle">
                        Facility Management
                    </div>

                </div>

            </div>


            <!-- User -->

            <div
                id="sidebar-user"
                class="sidebar-user"
            >

                <div
                    id="sidebar-avatar"
                    class="avatar"
                >
                    ?
                </div>

                <div class="sidebar-user-info">

                    <div
                        id="sidebar-user-name"
                        class="sidebar-user-name"
                    >
                        User
                    </div>

                    <div
                        id="sidebar-user-role"
                        class="sidebar-user-role"
                    >
                        Role
                    </div>

                </div>

            </div>


            <!-- Navigation -->

            <nav
                id="main-navigation"
                class="main-navigation"
            >

                <!--
                    Navigation is generated
                    dynamically according to role.
                -->

            </nav>


            <!-- Sidebar footer -->

            <div class="sidebar-footer">

                <button
                    id="logout-button"
                    class="sidebar-logout"
                    type="button"
                >

                    <span class="logout-icon">
                        ↪
                    </span>

                    <span>
                        Logout
                    </span>

                </button>

            </div>

        </aside>


        <!-- =============================================
             MAIN CONTENT
        ============================================== -->

        <div class="app-content">


            <!-- =========================================
                 TOPBAR
            ========================================== -->

            <header class="topbar">


                <!-- Mobile menu -->

                <button
                    id="mobile-menu-button"
                    class="icon-button mobile-menu-button"
                    type="button"
                    aria-label="Open menu"
                >
                    ☰
                </button>


                <!-- Page information -->

                <div class="topbar-page">

                    <div
                        id="topbar-title"
                        class="topbar-title"
                    >
                        Dashboard
                    </div>

                    <div
                        id="topbar-subtitle"
                        class="topbar-subtitle"
                    >
                        CleanTrack
                    </div>

                </div>


                <!-- Right side -->

                <div class="topbar-actions">


                    <!-- Organization -->

                    <div
                        id="topbar-organization"
                        class="organization-display"
                    >

                        <span class="organization-dot"></span>

                        <span id="organization-name">
                            Organization
                        </span>

                    </div>


                    <!-- Notifications -->

                    <button
                        id="notification-button"
                        class="icon-button notification-button"
                        type="button"
                        aria-label="Notifications"
                    >

                        <span>
                            ♢
                        </span>

                        <span
                            id="notification-count"
                            class="notification-count hidden"
                        >
                            0
                        </span>

                    </button>


                    <!-- Profile -->

                    <button
                        id="profile-button"
                        class="profile-button"
                        type="button"
                    >

                        <span
                            id="topbar-avatar"
                            class="avatar avatar-sm"
                        >
                            ?
                        </span>

                        <span
                            id="topbar-user-name"
                            class="profile-name"
                        >
                            User
                        </span>

                    </button>

                </div>

            </header>


            <!-- =========================================
                 PAGE CONTENT
            ========================================== -->

            <main
                id="page-content"
                class="page-content"
            >

                <!-- Dynamic page content -->

                <div
                    id="page-view"
                    class="page-view"
                ></div>

            </main>


        </div>

    </div>


</div>


<!-- =====================================================
     GLOBAL TOAST CONTAINER
====================================================== -->

<div
    id="toast-container"
    class="toast-container"
></div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="js/api.js"></script>

<script src="js/auth.js"></script>

<script src="js/navigation.js"></script>

<script src="js/app.js"></script>


</body>

</html>
