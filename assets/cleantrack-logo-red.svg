<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-labelledby="title desc"><title id="title">CleanTrack</title><desc id="desc">Crimson and black circular tracking mark with CleanTrack wordmark.</desc><defs><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff242d"/><stop offset="1" stop-color="#c90013"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="420" height="150" rx="8" fill="#050607"/><g transform="translate(210 45)" filter="url(#glow)"><path d="M-4-39A40 40 0 0 0-37 17 40 40 0 0 0 9 38L-5 25A25 25 0 0 1-22-9 25 25 0 0 1 8-22Z" fill="url(#red)"/><path d="M3-39A40 40 0 0 1 39-3L20 15 16 5 29-8 15-3 8 6 0-3 8-14 20-24A29 29 0 0 0 3-39Z" fill="url(#red)"/><circle r="13" fill="url(#red)"/><circle r="4" fill="#050607"/><path d="M-31 25-13 9-7 15-24 31Z M18 7 35-10 39-4 24 12Z" fill="#050607"/></g><text x="210" y="105" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" letter-spacing="4" fill="#f6f6f6" font-weight="500">CLEAN<tspan fill="#f5222d" font-weight="700">TRACK</tspan></text><text x="210" y="127" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8.5" letter-spacing="2.5" fill="#d0d0d0">CLEANER SPACES. SAFER TOMORROW.</text></svg>