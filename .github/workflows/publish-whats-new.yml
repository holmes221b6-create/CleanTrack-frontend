name: Publish feature updates
on:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect user-facing functional changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          before=os.environ.get("BEFORE_SHA","")
          after=os.environ["AFTER_SHA"]
          subject=os.environ.get("COMMIT_SUBJECT","").splitlines()[0].strip() or "Feature update"
          # Publish only when a developer explicitly labels the commit as a user-facing feature.
          # This prevents ordinary fixes, refactors, and incidental source edits from creating dots.
          if not re.match(r"^(feat|feature|enhance)(\([^)]+\))?:\s*\S", subject, re.I):
              print("Commit is not explicitly marked as a feature; no What's New entry.")
              raise SystemExit(0)
          if not before or set(before)=={"0"}:
              before=subprocess.check_output(["git","rev-parse",f"{after}^"],text=True).strip()

          # Explicitly suppress presentation-only and maintenance commits.
          if re.search(r"\b(css|style|visual|colour|color|theme|animation|layout|spacing|responsive|format|lint|refactor|chore|docs|test|bug|bugfix|hotfix)\b",subject,re.I):
              print("Presentation/maintenance/bug-fix commit: no What's New entry.")
              raise SystemExit(0)

          routes={
            "teams.js":["teams"], "org-tools.js":["inventory"],
            "supervisor-personnel.js":["personnel"],
            "performance-analysis.js":["performance-analysis"],
            "operations.js":["operations"], "supervisor-workspace.js":["workspace"],
            "quality-inspections.js":["inspections"], "announcements.js":["announcements"],
            "meetings.js":["meetings"], "reports.js":["reports"],
            "performance-arena.js":["performance"], "staff.js":["staff"],
            "locations.js":["locations"], "zones.js":["zones"],
            "supervisor-review-queue.js":["reviews"],
            "settings.js":["settings"], "preferences.js":["settings"],
            "staff-incidents.js":["incident-reports","incidents"],
            "supervisor-records.js":["incidents","inspections","handovers"],
            "supervisor-sites-zones.js":["sites"], "invitations.js":["invitations"],
            "audit-trail.js":["audit"], "organization-settings.js":["org-settings"],
            "admin-dashboard.js":["dashboard"], "admin-home.js":["home"],
            "supervisor-team-channel.js":["team-channel"], "teams-home.js":["teams"],
            "billing.js":["billing"], "analytics.js":["analytics"],
            "logs.js":["reviews"], "my-desk.js":["my-desk"],
            "inventory.js":["inventory"], "staff-workspace.js":["workspace"]
          }
          backend_routes={
            "teams.py":"teams", "operations.py":"operations",
            "personnel.py":"personnel", "performance.py":"performance-analysis",
            "analytics.py":"performance-analysis", "inventory.py":"inventory",
            "inspections.py":"inspections", "announcements.py":"announcements",
            "meetings.py":"meetings", "reports.py":"reports",
            "notifications.py":"notifications"
          }
          changed=subprocess.check_output(
            ["git","diff","--name-only",before,after],text=True
          ).splitlines()
          candidates={}
          for path in changed:
              name=path.rsplit("/",1)[-1]
              route=None
              route_list=[]
              if path.startswith("js/") and name.endswith(".js"):
                  route_list=routes.get(name,[])
              elif path.startswith("app/routes/") and name.endswith(".py"):
                  backend_route=backend_routes.get(name)
                  route_list=[backend_route] if backend_route else []
              for route in route_list:
                  candidates.setdefault(route,[]).append(path)

          # CSS, HTML, images, fonts and other presentation assets are never
          # considered. Require substantive added executable source plus a
          # signal of actual behaviour (actions, API/data flow, state or logic).
          signals=re.compile(
            r"addEventListener|\bon(click|change|submit)\b|"
            r"fetch\s*\(|\b(API|CleanTrackApi)\.(get|post|patch|request|download)\b|"
            r"@\w+\.(route|get|post|put|patch|delete)\b|"
            r"\b(router|dispatch|submit|handle[A-Z]\w*|save[A-Z]\w*|"
            r"create[A-Z]\w*|delete[A-Z]\w*|update[A-Z]\w*|"
            r"localStorage|sessionStorage|transaction|commit)\b|"
            r"\b(if|else|for|while|try|await|return)\b"
          )
          functional={}
          for route, files in candidates.items():
              added=[]
              for path in files:
                  diff=subprocess.check_output(
                    ["git","diff","--unified=0",before,after,"--",path],
                    text=True,errors="replace"
                  )
                  for line in diff.splitlines():
                      if not line.startswith("+") or line.startswith("+++"):
                          continue
                      code=line[1:].strip()
                      if not code or code.startswith(("//","#","*","/*","<!--")):
                          continue
                      added.append(code)
              executable=[line for line in added if not re.fullmatch(r"[{};,)]*",line)]
              if len(executable)>=4 and any(signals.search(line) for line in executable):
                  functional[route]=files

          if not functional:
              print("No substantive user-facing functional change detected; no dot.")
              raise SystemExit(0)

          file="whats-new.json"
          try:
              with open(file,encoding="utf-8") as f: manifest=json.load(f)
          except (FileNotFoundError,json.JSONDecodeError):
              manifest={"updates":[]}
          updates=manifest.setdefault("updates",[])
          for route, files in functional.items():
              uid=f"{after[:12]}-{route}"
              if any(x.get("id")==uid for x in updates): continue
              clean=re.sub(r"^(feat|feature|enhance|improve|update)(\([^)]+\))?:\s*","",subject,flags=re.I).strip()
              title=clean[:90] or f"{route.replace('-',' ').title()} feature update"
              updates.insert(0,{
                "id":uid,"page":route,"feature":title,
                "target":"#workspace-content",
                "description":f"{subject}. Functional changes were detected in: {', '.join(files[:4])}"+(f" and {len(files)-4} more source files." if len(files)>4 else "."),
                "commit":after,"published_at":os.environ.get("GITHUB_EVENT_NAME","push")
              })
          manifest["updates"]=updates[:100]
          with open(file,"w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          print("Published functional updates for:",", ".join(functional))
          PY
      - name: Commit release manifest
        run: |
          if git diff --quiet -- whats-new.json; then
            echo "No functional update to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whats-new.json
          git commit -m "chore: publish automatic What's New updates [skip ci]"
          git push
